# bull-terra regression gate (PRD §9.4). The SAME regression-aware CLI that runs
# locally runs on every PR, so "did I break something that worked?" is enforced
# for the whole team. Exits non-zero ONLY when a previously-passing test fails.
name: bull-terra regression gate

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install bull-terra + Chromium
        run: |
          npm i -g @kozocom/bull-terra
          npx playwright install --with-deps chromium

      # data.db carries the baselines. Commit it (or restore from cache/artifact)
      # so the gate knows which tests were previously green.
      - name: Run the regression gate
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          APP_USER: ${{ secrets.APP_USER }}
          APP_PASS: ${{ secrets.APP_PASS }}
        run: bull-terra run --all

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
